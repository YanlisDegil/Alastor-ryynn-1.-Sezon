<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gece Yayını</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#fbefe9;--ink:#3a0d1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150509;--ink:#fbeee6}}
:root[data-theme="dark"]{--bg:#150509;--ink:#fbeee6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;display:grid;place-items:center}
#stage{position:relative;width:min(100%,480px);height:100%;max-height:860px;overflow:hidden;background:#12040a;color:#fbeee6;user-select:none;-webkit-tap-highlight-color:transparent}
#stage.shake{animation:shake .5s}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg svg{animation:zoom 22s ease-in-out infinite alternate}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#stage::before{content:"";position:absolute;left:0;right:0;top:0;height:6%;background:#000;z-index:4}
#chars{position:absolute;left:0;right:0;top:12%;bottom:36%;display:flex;justify-content:space-evenly;align-items:flex-end}
.ch{position:relative;opacity:.5;filter:brightness(.6);transition:opacity .3s,filter .3s,transform .3s}
.ch.on{opacity:1;filter:drop-shadow(0 0 14px var(--c));transform:translateY(-8px)}
.ch.in{animation:slide .5s ease-out}
.ch svg,.ch img{height:100%;width:auto;display:block}
.ch span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap;color:var(--c);font-weight:600}
#box{position:absolute;left:4%;right:4%;bottom:3%;min-height:28%;padding:26px 18px 28px;background:rgba(18,4,10,.88);border:2px solid #f2c46d;border-radius:4px;z-index:3;cursor:pointer}
#who{position:absolute;top:-15px;left:14px;padding:2px 14px;background:#12040a;border:2px solid #f2c46d;font-family:'Playfair Display',Georgia,serif;font-weight:700}
#who:empty{display:none}
#txt{line-height:1.55}
#box.nar #txt{font-style:italic;color:#e8cfc8}
#more{position:absolute;right:14px;bottom:6px;color:#f2c46d;animation:blink 1s infinite}
#choices{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:60px 4% 4%;display:grid;gap:10px;background:linear-gradient(transparent,rgba(10,3,8,.95) 30%)}
#choices p{margin:0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.1rem;color:#f2c46d}
[hidden]{display:none!important}
button{font:inherit;color:#fbeee6;text-align:left;cursor:pointer;background:rgba(58,21,34,.95);border:2px solid #5c2335;border-radius:4px;padding:12px 16px}
button:hover{border-color:#f2c46d}
button:focus-visible{outline:3px solid #f2c46d;outline-offset:2px}
button.main{background:#ff4d6d;color:#150509;border-color:#ff4d6d;font-weight:600;text-align:center}
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;background:rgba(10,3,8,.96);opacity:0;pointer-events:none;transition:opacity .45s;overflow-y:auto}
.ov.show{opacity:1;pointer-events:auto}
.ov h1,.ov h2{font-family:'Playfair Display',Georgia,serif;margin:0 0 14px;line-height:1.15}
.ov h1{font-size:2.2rem}.ov h2{font-size:1.8rem;color:#f2c46d;font-style:italic}
.ov small{color:#ff4d6d;font-weight:600;margin-bottom:8px;display:block}
.ov p{margin:0 0 12px;color:#e8cfc8}
.note{border-left:4px solid #ff4d6d;padding-left:14px;color:#fbeee6!important}
.fine{font-size:.78rem;color:#a98891!important;margin-top:14px!important}
@keyframes zoom{to{transform:scale(1.1)}}
@keyframes slide{from{opacity:0;transform:translateY(30px)}}
@keyframes blink{50%{opacity:.2}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
 <div id="bg"></div><div id="chars"></div><div class="vig"></div>
 <div id="box"><div id="who"></div><div id="txt"></div><div id="more">▾</div></div>
 <div id="choices" hidden></div>
 <div id="card" class="ov"></div>
 <div id="end" class="ov"></div>
 <div id="menu" class="ov show">
   <small>BÖLÜM 1</small><h1>Yeni Misafir</h1>

   <p id="prog" class="fine"></p>
   <button class="main" id="go">Yayını başlat</button>
   <p class="fine">Hayran yapımı, kişisel bir hediye. Resmi bir içerik değildir.</p>
 </div>
</div>

const $=id=>document.getElementById(id);
let Q=[],st,prev=[],timer,typing=false,full="",bgNow="",choosing=false;
const allies=()=>Object.keys(st.al).length;
function found(){try{return JSON.parse(localStorage.getItem("reyyan_sonlar")||"[]");}catch(e){return [];}}
function save(k){try{const f=found();if(!f.includes(k)){f.push(k);localStorage.setItem("reyyan_sonlar",JSON.stringify(f));}}catch(e){}}
function start(){st={g:0,p:0,s:0,al:{},last:"",team:false,chaos:0};Q=SCRIPT.slice();prev=[];bgNow="";$("menu").classList.remove("show");$("end").classList.remove("show");next();}
function next(){const s=Q.shift();if(!s)return ending();s.card?card(s):s.q?ask(s):say(s);}
function say(s){
 if(s.bg!==bgNow){bgNow=s.bg;$("bg").innerHTML=BG[s.bg];}
 const ids=s.c.split("");
 $("chars").innerHTML=ids.map(id=>{const [nm,col,sc]=CH[id];return `<div class="ch${id===s.n?" on":""}${prev.includes(id)?"":" in"}" style="--c:${col};height:${Math.round(sc*92)}%"><span>${nm}</span>${IMG[id]?`<img src="${IMG[id]}" alt="">`:SIL(col)}</div>`}).join("");
 prev=ids;
 $("who").textContent=s.n?CH[s.n][0]:"";$("who").style.color=s.n?CH[s.n][1]:"";
 $("box").classList.toggle("nar",!s.n);
 if(s.fx){const st2=$("stage");st2.classList.remove("shake");void st2.offsetWidth;st2.classList.add("shake");}
 type(s.x);
}
function type(x){clearInterval(timer);full=x;typing=true;let i=0;$("txt").textContent="";$("more").style.opacity=0;
 timer=setInterval(()=>{i++;$("txt").textContent=full.slice(0,i);if(i>=full.length)done();},24);}
function done(){clearInterval(timer);typing=false;$("txt").textContent=full;$("more").style.opacity=1;}
function advance(){if(choosing||$("menu").classList.contains("show")||$("end").classList.contains("show"))return;typing?done():next();}
function ask(s){
 choosing=true;const os=s.o.filter(o=>o[4]!=="team"||allies()>=2);
 $("choices").innerHTML=`<p>${s.q}</p>`+os.map((o,i)=>`<button data-i="${i}">${o[0]}</button>`).join("");$("choices").hidden=false;
 $("choices").onclick=e=>{const b=e.target.closest("button");if(!b)return;const o=os[+b.dataset.i];
  if(o[1]){st[o[1]]++;st.last=o[1];}
  if(o[2])st.al[o[2]]=1;
  if(o[4]==="team")st.team=true;
  if(o[5])st.chaos+=o[5];
  $("choices").hidden=true;$("choices").innerHTML="";choosing=false;Q.unshift(...o[3]);next();};
}
function card(s){const c=$("card");c.innerHTML=`<small>${s.card}</small><h2>${s.sub}</h2>`;c.classList.add("show");
 let t;const go=()=>{clearTimeout(t);c.onclick=null;c.classList.remove("show");setTimeout(next,450);};t=setTimeout(go,2600);c.onclick=go;}
function ending(){
 const allyN=allies();let k;
 if(st.team&&st.chaos<2)k="team";
 else if(st.chaos>=3)k="kicked";
 else if(allyN===0)k="lonely";
 else if(st.al.alastor&&st.chaos<2&&st.p>=st.g&&st.p>=st.s)k="alastor";
 else{const m=Math.max(st.g,st.p,st.s);k=[st.last,"g","p","s"].find(x=>x&&st[x]===m);}
 save(k);
 const f=Object.keys(st.al).map(a=>ALN[a]).join(", ");
 const fn=found().length, tt=Object.keys(ENDS).length;
 $("end").innerHTML=`<small>SON</small><h2>${ENDS[k][0]}</h2><p>${ENDS[k][1]}</p>${f?`<p>Dost olduğun kişiler: ${f}.</p>`:""}<p class="note">${NOTE}</p><p>${FROM}</p><p class="fine">${fn} / ${tt} farklı son keşfettin.</p><button class="main" id="again">Başka bir yol dene</button>`;
 $("end").classList.add("show");$("again").onclick=start;
}
const fn0=found().length, tt0=Object.keys(ENDS).length;
if(fn0)$("prog").textContent=`Şimdiye kadar ${fn0} / ${tt0} farklı son keşfettin.`;
$("box").onclick=advance;
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.tagName!=="BUTTON"){e.preventDefault();advance();}});
$("go").onclick=start;
</script>
